# minieap 认证配置
#
# 本文件出厂不含任何有效参数——所有配置都以"你第一次手动认证成功的那次"为准。
#
# 首次使用（USB 键盘或 SSH 进终端）：
#
#   minieap -u 你的账号 -p 你的密码 -n eth1 --module rjv3 -d 0 -w
#
#   -n  认证所用的物理网口（用 ip -o link show 看实际名字）
#   -d  DHCP 方式：0 不做（由系统取地址）、2 认证后执行 dhcp-script
#   -w  把本次参数写回本文件；下次开机自启直接复用
#
# 认证成功、能上网之后，按 Ctrl+C 结束这次手动运行，然后：
#
#   /etc/init.d/minieap enable
#   /etc/init.d/minieap restart
#
# 之后开机自动认证，无需再管。
#
# 想改参数时，直接编辑本文件后 restart 即可；所有键与 minieap 命令行参数一一对应。
