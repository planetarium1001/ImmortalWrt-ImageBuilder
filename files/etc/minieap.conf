# minieap 认证配置（与上游 minieap.conf 逐键对齐）
#
# 这个文件是认证的唯一配置入口：改这里就改行为，不需要动任何脚本或 UCI。
# 终端手工调试：
#   minieap -u 账号 -p 密码 -n eth0 --module rjv3
# 开机自启：/etc/init.d/minieap（读取本文件）

# 账号与密码（必填）
username=
password=

# 认证使用的物理网口
nic=eth0

# 数据包插件：锐捷 v3/v4 用 rjv3
module=rjv3

# DHCP 方式：0 不做、1 二次认证、2 认证后、3 认证前。
# 本固件设为 0——地址交给 WAN 接口的原生 dhcp 客户端，避免两边同时要地址。
# 若某网络要求"认证后由客户端自己取地址"，改成 2 并配 dhcp-script。
dhcp-type=0

# ---- 以下为可选参数，留空则使用程序内置默认值 ----

# 收发实现：Linux 用 sockraw，其他平台用 libpcap
#if-impl=sockraw

# 单个认证阶段超时（秒），程序默认 5
#stage-timeout=5

# 认证失败后重试前的等待（秒），程序默认 30
#wait-after-fail=30

# 最大允许连续失败次数，程序默认 3
#max-fail=3

# 最大重试次数，程序默认 3；0 表示不限制
#max-retries=0

# 认证轮次，程序默认 1
#auth-round=1

# 掉线后不自动重连：这是个无参旗标（-x），写 1 才会关闭自动重连
#no-auto-reauth=1

# pid 文件与日志文件
#pid-file=/var/run/minieap.pid
#log-file=/var/log/minieap.log
